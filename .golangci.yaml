version: "2"
linters:
  enable:
    - canonicalheader
    - cyclop
    - dupl
    - errcheck
    - funcorder
    - funlen
    - gochecknoglobals
    - gosec
    - importas
    - ineffassign
    - interfacebloat
    - misspell
    - mnd
    - nlreturn
    - reassign
    - varnamelen
  settings:
    errcheck:
      # viper.BindEnv only errors when called with no key at all, which can't
      # happen at these call sites since the key is a hardcoded string literal.
      exclude-functions:
        - github.com/spf13/viper.BindEnv
    gosec:
      excludes:
        # G104 duplicates errcheck (which is also enabled); no need for both
        # to report the same unchecked-error findings.
        - G104
    nlreturn:
      block-size: 5
    varnamelen:
      ignore-names:
        - id
        - ip
        - db
        - fs
      ignore-decls:
        - h http.Handler
        - w http.ResponseWriter
        - r *http.Request
        - t testing.T
        - b strings.Builder
        - d Dialect
        - s string
  exclusions:
    rules:
      # Generated code is not ours to lint.
      - path: internal/api/types/
        linters:
          - dupl
          - funlen
          - gochecknoglobals
          - gosec
          - lll
          - mnd
          - varnamelen
formatters:
  enable:
    - gofmt
    - goimports
run:
  tests: false
  modules-download-mode: readonly
